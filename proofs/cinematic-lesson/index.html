<!doctype html>
<html lang="en" data-resolution="landscape" data-composition-variables='[{"id":"lessonTitle","type":"string","label":"Lesson title","default":"Multiply by 10"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #160f0b; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #160f0b; }
      .lesson-scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-ofop" id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080">
      <div data-hf-id="hf-6ivo" id="establish" class="clip lesson-scene" data-composition-id="establish" data-composition-src="compositions/establish.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics"></div>
      <div data-hf-id="hf-i4av" id="shift" class="clip lesson-scene" data-composition-id="shift" data-composition-src="compositions/shift.html" data-start="4" data-duration="5" data-track-index="2" data-track-kind="graphics"></div>
      <div data-hf-id="hf-2xpd" id="resolve" class="clip lesson-scene" data-composition-id="resolve" data-composition-src="compositions/resolve.html" data-start="9" data-duration="5" data-track-index="3" data-track-kind="graphics"></div>
      <audio data-hf-id="hf-3i2e" id="voiceover" class="clip" src="assets/audio/voice.wav" data-start="0" data-duration="14" data-track-index="10" data-volume="1" data-audio-group="voiceover"></audio>
      <audio data-hf-id="hf-582u" id="music" class="clip" src="assets/audio/music.wav" data-start="0" data-duration="14" data-track-index="11" data-volume="1" data-audio-group="music"></audio>
      <audio data-hf-id="hf-kv4h" id="machine-sfx" class="clip" src="assets/audio/sfx.wav" data-start="0" data-duration="14" data-track-index="12" data-volume="1" data-audio-group="sfx"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines.main = tl;
      tl.seek(0);
    </script>
  </body>
</html>
