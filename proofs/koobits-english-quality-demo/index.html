<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920,height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f5a936;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .beat {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="155"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="hook"
        class="clip beat"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="12"
        data-track-index="1"
        data-track-kind="graphics"
      ></div>
      <div
        id="notice"
        class="clip beat"
        data-composition-id="notice"
        data-composition-src="compositions/notice.html"
        data-start="12"
        data-duration="23"
        data-track-index="2"
        data-track-kind="graphics"
      ></div>
      <div
        id="model"
        class="clip beat"
        data-composition-id="model"
        data-composition-src="compositions/model.html"
        data-start="35"
        data-duration="30"
        data-track-index="3"
        data-track-kind="graphics"
      ></div>
      <div
        id="sort"
        class="clip beat"
        data-composition-id="sort"
        data-composition-src="compositions/sort.html"
        data-start="65"
        data-duration="25"
        data-track-index="4"
        data-track-kind="graphics"
      ></div>
      <div
        id="guided"
        class="clip beat"
        data-composition-id="guided"
        data-composition-src="compositions/guided.html"
        data-start="90"
        data-duration="25"
        data-track-index="5"
        data-track-kind="graphics"
      ></div>
      <div
        id="respond"
        class="clip beat"
        data-composition-id="respond"
        data-composition-src="compositions/respond.html"
        data-start="115"
        data-duration="25"
        data-track-index="6"
        data-track-kind="graphics"
      ></div>
      <div
        id="recap"
        class="clip beat"
        data-composition-id="recap"
        data-composition-src="compositions/recap.html"
        data-start="140"
        data-duration="15"
        data-track-index="7"
        data-track-kind="graphics"
      ></div>
      <div
        id="captions"
        class="clip beat"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="155"
        data-track-index="10"
        data-track-kind="captions"
      ></div>
      <audio
        id="voiceover"
        class="clip"
        src="assets/audio/voice.wav"
        data-start="0"
        data-duration="155"
        data-track-index="20"
        data-volume="1"
        data-audio-group="voiceover"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines.main = tl;
      tl.seek(0);
    </script>
  </body>
</html>
