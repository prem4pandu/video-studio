<template>
  <style>
    #root { position:absolute; inset:0; overflow:hidden; font-family:Nunito,sans-serif; pointer-events:none; }
    .caption { position:absolute; left:190px; right:190px; bottom:24px; text-align:center; }
    .caption span { display:inline-block; max-width:1480px; padding:12px 24px 14px; border-radius:14px; color:#fff; background:rgba(20,26,27,.92); font-size:32px; line-height:1.2; font-weight:800; box-shadow:0 4px 16px rgba(0,0,0,.28); }
  </style>
  <div data-hf-id="hf-26ik" id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="280">
    <div data-hf-id="hf-2dcs" id="caption-001" class="clip caption" data-start="0" data-duration="3" data-track-index="1"><span data-hf-id="hf-bzv3">Here is twenty-three.</span></div>
    <div data-hf-id="hf-xpb6" id="caption-002" class="clip caption" data-start="3" data-duration="5" data-track-index="1"><span data-hf-id="hf-8jdc">What happens when we make its value ten times as great?</span></div>
    <div data-hf-id="hf-9j03" id="caption-003" class="clip caption" data-start="8" data-duration="4" data-track-index="1"><span data-hf-id="hf-01p3">Watch the places, not just the digits.</span></div>
    <div data-hf-id="hf-3tlz" id="caption-004" class="clip caption" data-start="12" data-duration="6" data-track-index="1"><span data-hf-id="hf-o92k">Today, you will explain multiplication by ten using place value.</span></div>
    <div data-hf-id="hf-7428" id="caption-005" class="clip caption" data-start="18" data-duration="6" data-track-index="1"><span data-hf-id="hf-ih6t">First we will build a number. Then we will predict, prove, and practise.</span></div>
    <div data-hf-id="hf-ew3e" id="caption-006" class="clip caption" data-start="24" data-duration="6" data-track-index="1"><span data-hf-id="hf-ihvx">By the end, you will know where every digit goes, and why zero is needed.</span></div>
    <div data-hf-id="hf-b6zb" id="caption-007" class="clip caption" data-start="30" data-duration="5" data-track-index="1"><span data-hf-id="hf-hakw">Let us build twenty-three.</span></div>
    <div data-hf-id="hf-hhpx" id="caption-008" class="clip caption" data-start="35" data-duration="9" data-track-index="1"><span data-hf-id="hf-uddn">The digit two is in the tens place. It means two tens.</span></div>
    <div data-hf-id="hf-o57f" id="caption-009" class="clip caption" data-start="44" data-duration="6" data-track-index="1"><span data-hf-id="hf-dgcb">Two tens have a value of twenty.</span></div>
    <div data-hf-id="hf-106o" id="caption-010" class="clip caption" data-start="50" data-duration="8" data-track-index="1"><span data-hf-id="hf-m9f5">The digit three is in the ones place. It means three ones.</span></div>
    <div data-hf-id="hf-b2e2" id="caption-011" class="clip caption" data-start="58" data-duration="7" data-track-index="1"><span data-hf-id="hf-fcy0">Twenty plus three is twenty-three: two tens and three ones.</span></div>
    <div data-hf-id="hf-q51c" id="caption-012" class="clip caption" data-start="65" data-duration="6" data-track-index="1"><span data-hf-id="hf-qacn">Now multiply twenty-three by ten. Where should each digit move?</span></div>
    <div data-hf-id="hf-no5f" id="caption-013" class="clip caption" data-start="71" data-duration="3" data-track-index="1"><span data-hf-id="hf-1gga">Stay put, one place left, or one place right?</span></div>
    <div data-hf-id="hf-dzcl" id="caption-014" class="clip caption" data-start="74" data-duration="7" data-track-index="1"><span data-hf-id="hf-111z">Think: where should each digit move?</span></div>
    <div data-hf-id="hf-7vxr" id="caption-015" class="clip caption" data-start="81" data-duration="4" data-track-index="1"><span data-hf-id="hf-uba9">Choose one place left. Now let us prove why.</span></div>
    <div data-hf-id="hf-1uw6" id="caption-016" class="clip caption" data-start="85" data-duration="6" data-track-index="1"><span data-hf-id="hf-do3d">Multiplying by ten makes the value of every digit ten times as great.</span></div>
    <div data-hf-id="hf-87mn" id="caption-017" class="clip caption" data-start="91" data-duration="9" data-track-index="1"><span data-hf-id="hf-o0ut">Each ten becomes one hundred. So two tens become two hundreds.</span></div>
    <div data-hf-id="hf-f17x" id="caption-018" class="clip caption" data-start="100" data-duration="9" data-track-index="1"><span data-hf-id="hf-bght">Each one becomes one ten. So three ones become three tens.</span></div>
    <div data-hf-id="hf-qoeg" id="caption-019" class="clip caption" data-start="109" data-duration="6" data-track-index="1"><span data-hf-id="hf-w9pj">The two moves from Tens to Hundreds. The three moves from Ones to Tens.</span></div>
    <div data-hf-id="hf-hbbl" id="caption-020" class="clip caption" data-start="115" data-duration="4" data-track-index="1"><span data-hf-id="hf-wezv">Now the ones place is empty.</span></div>
    <div data-hf-id="hf-mddd" id="caption-021" class="clip caption" data-start="119" data-duration="3" data-track-index="1"><span data-hf-id="hf-ymu0">Zero records zero ones.</span></div>
    <div data-hf-id="hf-x1q0" id="caption-022" class="clip caption" data-start="122" data-duration="3" data-track-index="1"><span data-hf-id="hf-zylv">Two hundred plus thirty is two hundred thirty.</span></div>
    <div data-hf-id="hf-ydh5" id="caption-023" class="clip caption" data-start="125" data-duration="6" data-track-index="1"><span data-hf-id="hf-svvg">You may have heard, “Just add a zero.” That can hide the real reason.</span></div>
    <div data-hf-id="hf-ccpa" id="caption-024" class="clip caption" data-start="131" data-duration="7" data-track-index="1"><span data-hf-id="hf-l7xz">Zero did not push the two and three. Their values changed first.</span></div>
    <div data-hf-id="hf-gt7q" id="caption-025" class="clip caption" data-start="138" data-duration="7" data-track-index="1"><span data-hf-id="hf-gs2o">After they moved, the ones place was empty. Zero recorded that empty place.</span></div>
    <div data-hf-id="hf-j4zz" id="caption-026" class="clip caption" data-start="145" data-duration="5" data-track-index="1"><span data-hf-id="hf-jlro">For whole numbers, the result may look as if a zero was attached.</span></div>
    <div data-hf-id="hf-jylk" id="caption-027" class="clip caption" data-start="150" data-duration="5" data-track-index="1"><span data-hf-id="hf-gxsx">Our reliable rule is: each digit moves one place left.</span></div>
    <div data-hf-id="hf-3z9u" id="caption-028" class="clip caption" data-start="155" data-duration="5" data-track-index="1"><span data-hf-id="hf-2rng">Now we will solve forty-one times ten together.</span></div>
    <div data-hf-id="hf-oex3" id="caption-029" class="clip caption" data-start="160" data-duration="5" data-track-index="1"><span data-hf-id="hf-sr1o">Say the starting places: four tens and one one.</span></div>
    <div data-hf-id="hf-fb0r" id="caption-030" class="clip caption" data-start="165" data-duration="4" data-track-index="1"><span data-hf-id="hf-fd4k">What does four tens become after multiplying by ten?</span></div>
    <div data-hf-id="hf-6ldy" id="caption-031" class="clip caption" data-start="169" data-duration="4" data-track-index="1"><span data-hf-id="hf-txjn">Think.</span></div>
    <div data-hf-id="hf-k1qg" id="caption-032" class="clip caption" data-start="173" data-duration="4" data-track-index="1"><span data-hf-id="hf-7co3">Four hundreds, with a value of four hundred.</span></div>
    <div data-hf-id="hf-xv59" id="caption-033" class="clip caption" data-start="177" data-duration="4" data-track-index="1"><span data-hf-id="hf-cbyq">What does one one become?</span></div>
    <div data-hf-id="hf-ancl" id="caption-034" class="clip caption" data-start="181" data-duration="4" data-track-index="1"><span data-hf-id="hf-rq0j">Think.</span></div>
    <div data-hf-id="hf-wvl4" id="caption-035" class="clip caption" data-start="185" data-duration="4" data-track-index="1"><span data-hf-id="hf-mfza">One ten, with a value of ten.</span></div>
    <div data-hf-id="hf-lkvu" id="caption-036" class="clip caption" data-start="189" data-duration="3" data-track-index="1"><span data-hf-id="hf-k2zj">What belongs in the empty ones place?</span></div>
    <div data-hf-id="hf-17n7" id="caption-037" class="clip caption" data-start="192" data-duration="3" data-track-index="1"><span data-hf-id="hf-rbpi">Think.</span></div>
    <div data-hf-id="hf-ieo9" id="caption-038" class="clip caption" data-start="195" data-duration="5" data-track-index="1"><span data-hf-id="hf-4a6q">Zero ones. Four hundred plus ten is four hundred ten. Forty-one times ten equals four hundred ten.</span></div>
    <div data-hf-id="hf-9ver" id="caption-039" class="clip caption" data-start="200" data-duration="7" data-track-index="1"><span data-hf-id="hf-clcw">Your turn. Solve forty-seven times ten. Use the places to explain your answer.</span></div>
    <div data-hf-id="hf-rd3u" id="caption-040" class="clip caption" data-start="207" data-duration="12" data-track-index="1"><span data-hf-id="hf-5ri8">Think independently.</span></div>
    <div data-hf-id="hf-0uea" id="caption-041" class="clip caption" data-start="219" data-duration="5" data-track-index="1"><span data-hf-id="hf-vndm">Now commit: where does four move, where does seven move, and what fills Ones?</span></div>
    <div data-hf-id="hf-m8e8" id="caption-042" class="clip caption" data-start="224" data-duration="6" data-track-index="1"><span data-hf-id="hf-a2n3">Commit your answer.</span></div>
    <div data-hf-id="hf-x6dr" id="caption-043" class="clip caption" data-start="230" data-duration="5" data-track-index="1"><span data-hf-id="hf-fnsl">Four tens become four hundreds. Seven ones become seven tens.</span></div>
    <div data-hf-id="hf-40gh" id="caption-044" class="clip caption" data-start="235" data-duration="5" data-track-index="1"><span data-hf-id="hf-qpwu">The ones place is empty, so zero records zero ones.</span></div>
    <div data-hf-id="hf-xzrc" id="caption-045" class="clip caption" data-start="240" data-duration="5" data-track-index="1"><span data-hf-id="hf-o2hj">Four hundred plus seventy is four hundred seventy.</span></div>
    <div data-hf-id="hf-2su2" id="caption-046" class="clip caption" data-start="245" data-duration="5" data-track-index="1"><span data-hf-id="hf-8vun">Forty-seven times ten equals four hundred seventy.</span></div>
    <div data-hf-id="hf-cnrf" id="caption-047" class="clip caption" data-start="250" data-duration="7" data-track-index="1"><span data-hf-id="hf-0txe">Remember: multiplying a whole number by ten makes every digit worth ten times as much.</span></div>
    <div data-hf-id="hf-zb9o" id="caption-048" class="clip caption" data-start="257" data-duration="6" data-track-index="1"><span data-hf-id="hf-pbgj">Each digit takes the place immediately to its left.</span></div>
    <div data-hf-id="hf-qxnd" id="caption-049" class="clip caption" data-start="263" data-duration="5" data-track-index="1"><span data-hf-id="hf-w48g">Then zero records the empty ones place.</span></div>
    <div data-hf-id="hf-9uow" id="caption-050" class="clip caption" data-start="268" data-duration="5" data-track-index="1"><span data-hf-id="hf-zww4">Twenty-three became two hundred thirty.</span></div>
    <div data-hf-id="hf-217r" id="caption-051" class="clip caption" data-start="273" data-duration="3" data-track-index="1"><span data-hf-id="hf-dj4u">Forty-one became four hundred ten.</span></div>
    <div data-hf-id="hf-1f7c" id="caption-052" class="clip caption" data-start="276" data-duration="4" data-track-index="1"><span data-hf-id="hf-9ixr">And forty-seven became four hundred seventy. Value changes because place changes.</span></div>
  </div>

</template>
