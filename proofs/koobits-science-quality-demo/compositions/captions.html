<template><style>#root{position:absolute;inset:0;pointer-events:none;font-family:Arial,sans-serif}.cap{position:absolute;left:190px;right:190px;bottom:22px;text-align:center}.cap span{display:inline-block;max-width:1500px;padding:12px 24px;border-radius:14px;background:rgba(20,32,34,.94);color:#fff;font-size:31px;line-height:1.22;font-weight:800}</style><div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="160">
<div class="clip cap" data-start="0" data-duration="4"><span>This robot moves, flashes and makes sounds.</span></div>
<div class="clip cap" data-start="4" data-duration="4"><span>Does that mean it is living?</span></div>
<div class="clip cap" data-start="8" data-duration="4"><span>Let us investigate with evidence.</span></div>
<div class="clip cap" data-start="12" data-duration="5"><span>Predict: living, non-living, or do we need more evidence?</span></div>
<div class="clip cap" data-start="17" data-duration="7"><span>Think. What evidence would convince you?</span></div>
<div class="clip cap" data-start="24" data-duration="6"><span>We need more evidence. Movement is only one clue.</span></div>
<div class="clip cap" data-start="30" data-duration="7"><span>Living things carry out a pattern of life processes.</span></div>
<div class="clip cap" data-start="37" data-duration="7"><span>They need resources, such as water and nutrients.</span></div>
<div class="clip cap" data-start="44" data-duration="7"><span>They grow from within and produce new living things of their kind.</span></div>
<div class="clip cap" data-start="51" data-duration="7"><span>They also respond to changes around them. One clue alone is not enough.</span></div>
<div class="clip cap" data-start="58" data-duration="7"><span>Compare a plant with the robot.</span></div>
<div class="clip cap" data-start="65" data-duration="8"><span>The plant takes in water and nutrients, grows from within, and can produce new plants.</span></div>
<div class="clip cap" data-start="73" data-duration="7"><span>The robot uses electricity. It does not grow or produce robot offspring.</span></div>
<div class="clip cap" data-start="80" data-duration="6"><span>Its responses are programmed. The evidence classifies it as non-living.</span></div>
<div class="clip cap" data-start="86" data-duration="7"><span>Movement alone does not prove that something is living.</span></div>
<div class="clip cap" data-start="93" data-duration="7"><span>A plant may seem still, yet it slowly responds to light and grows.</span></div>
<div class="clip cap" data-start="100" data-duration="6"><span>A robot may move quickly, but it follows instructions.</span></div>
<div class="clip cap" data-start="106" data-duration="5"><span>Try one with me. A dry seed does not move. Is it living?</span></div>
<div class="clip cap" data-start="111" data-duration="6"><span>Think about what it can do under the right conditions.</span></div>
<div class="clip cap" data-start="117" data-duration="9"><span>It is living. With water, warmth and air, the seed can use stored food, grow and become a plant.</span></div>
<div class="clip cap" data-start="126" data-duration="4"><span>Your turn. A bicycle moves when a rider pedals.</span></div>
<div class="clip cap" data-start="130" data-duration="8"><span>Living or non-living? Decide from evidence.</span></div>
<div class="clip cap" data-start="138" data-duration="7"><span>It is non-living. It does not carry out life processes; its motion comes from the rider.</span></div>
<div class="clip cap" data-start="145" data-duration="5"><span>Remember our science routine: observe, test, and explain.</span></div>
<div class="clip cap" data-start="150" data-duration="5"><span>Do not classify from one flashy clue.</span></div>
<div class="clip cap" data-start="155" data-duration="5"><span>Use a pattern of evidence about life processes.</span></div>
